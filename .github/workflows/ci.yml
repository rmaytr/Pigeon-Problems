name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 24 · tests, build and browser QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check documentation links and images
        run: npm run docs:check
      - name: Test simulation, sessions and voice lifecycle
        run: npm test
      - name: Build production client
        run: npm run build
      - name: Test real local WebSockets and delayed transport
        run: npm run test:integration
      - name: Install browser and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Test real rendered UI, aiming, trials and recovery
        run: npm run test:ui
